name: Build Kernel 9820

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (OneUI7-9820)'
        required: true
        default: 'OneUI7-9820'

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [beyond0lte, beyond1lte, beyond2lte, beyondx]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            p7zip-full jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
            curl xxd patchelf flex bison libarchive-tools build-essential pcre2-utils
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo apt clean

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Build kernel (${{ matrix.target }})
        run: |
          ./build.sh -m ${{ matrix.target }} -k y -r n

      - name: Upload artifact (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.target }}
          path: build/out/${{ matrix.target }}/*.zip

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: raw_artifacts

      - name: Flatten artifacts directory structure
        run: |
          mkdir -p final_artifacts
          find raw_artifacts/ -name "*.zip" -exec cp {} final_artifacts/ \;

      - name: Generate Safe Git Tag
        id: git_tag
        run: |
          SAFE_TAG=$(echo "${{ inputs.tag }}" | sed 's/[\/\\:*?"<>|]/-/g')
          echo "SAFE_TAG=$SAFE_TAG" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.SAFE_TAG }}
          name: "${{ inputs.tag }}"
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "final_artifacts/*.zip"
          body: |
            ## Official OneUI 7 Release for Kernel 9820

            Automated build generated by GitHub Actions.

            - **Commit SHA:** `${{ github.sha }}`
            - **Tag Reference:** `${{ env.SAFE_TAG }}`

            #### 🔹 Galaxy S10 Series
            | Device Name | Codename | File Name |
            | :--- | :--- | :--- |
            | Galaxy S10e | `beyond0lte` | `*beyond0lte*.zip` |
            | Galaxy S10 | `beyond1lte` | `*beyond1lte*.zip` |
            | Galaxy S10+ | `beyond2lte` | `*beyond2lte*.zip` |
            | Galaxy S10 5G | `beyondx` | `*beyondx*.zip` |

            _Note: Ensure you are on the correct OneUI 7 firmware base before flashing._
